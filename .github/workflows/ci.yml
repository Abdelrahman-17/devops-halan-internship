name: CI Pipeline - Docker Build & Health Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Clone repository code into the runner
      - name: Check out repository code
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. Fail-Fast: Python Linting Step (Extension Task)
      - name: Install & Run Ruff Linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check .

      # 4. Build Docker Image
      - name: Build Docker image
        run: |
          docker build -t myapp:test ./task3-git-foundations

      # 5. Run Docker Container
      - name: Run container
        run: |
          docker run -d -p 5000:5000 --name test-container myapp:test
          sleep 3

      # 6. Test Health Endpoint
      - name: Verify Health Endpoint
        run: |
          curl -f http://localhost:5000/health || exit 1

      # 7. Cleanup Container
      - name: Stop and remove container
        if: always()
        run: |
          docker stop test-container || true
          docker rm test-container || true
