name: CI/CD Pipeline - Docker Build, Test & Push

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من الـ Repository
      - name: Check out repository code
        uses: actions/checkout@v4

      # 2. إعداد بايثون
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. تشغيل أداة الـ Linter (Ruff)
      - name: Install & Run Ruff Linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check --exit-zero .

      # 4. بناء الـ Docker Image باسم الحساب للرفع
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest ./task3-git-foundations

      # 5. تشغيل الـ Container للاختبار محلياً على السيرفر الافتراضي
      - name: Run container for health test
        run: |
          docker run -d -p 5000:5000 --name test-container ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest
          sleep 3

      # 6. التثبت من الـ Health Check Endpoint
      - name: Verify Health Endpoint
        run: |
          curl -f http://localhost:5000/health || exit 1

      # 7. تنظيف الـ Container التجريبي
      - name: Stop and remove test container
        if: always()
        run: |
          docker stop test-container || true
          docker rm test-container || true

      # 8. تسجيل الدخول على Docker Hub (فقط في حالة الـ Push على main)
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 9. رفع الـ Image النهائية الجاهزة إلى Docker Hub Registry
      - name: Push Docker Image to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest
